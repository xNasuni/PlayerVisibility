plugins {
    id 'net.fabricmc.fabric-loom-remap' apply false
    id 'maven-publish'
}

apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'

base {
    archivesName = "${rootProject.name}-${project.name}"
}

repositories {
    maven {
        name = 'fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    exclusiveContent {
        // Modern Yarn
        forRepository {
            maven {
                name = 'RelativityMC Maven'
                url = 'https://repo.codemc.io/repository/relativitymc/'
            }
        }
        filter {
            includeGroup 'org.relativitymc'
        }
    }
    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(modImplementation("maven.modrinth:crossfabric:0.1.1"))

    implementation "org.spongepowered:mixin:0.8.5"
    implementation project(":common")
}

loom {
    useIntermediateMappings = true
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    accessWidenerPath = file("src/main/resources/playervisibility.aw")
}

remapJar {
    addNestedDependencies = true
}

jar {
    from project(":common").sourceSets.main.output
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// helps my flowstate when developing :3
def autopush = providers.environmentVariable("xNasuniPlayerVisibilityFlowStateAutopushScript")
tasks.register('xNasuniPlayerVisibilityFlowStateAutopush', Exec) {
    dependsOn tasks.named('remapJar')
    onlyIf { autopush.isPresent() && !autopush.get().isBlank() }

    workingDir = layout.projectDirectory.asFile

    doFirst {
        def builtJar = tasks.named('remapJar').get().archiveFile.get().asFile
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', autopush.get(), builtJar.absolutePath
    }
}

tasks.named('build') {
    finalizedBy 'xNasuniPlayerVisibilityFlowStateAutopush'
}