plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT' apply false
	id 'maven-publish'
}

allprojects {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}
}

subprojects {
	version = project.mod_version
	group = project.maven_group
}